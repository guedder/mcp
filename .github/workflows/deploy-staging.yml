# Publica a imagem no ECR e faz o serviço de staging adotar a revisão.
#
# Separado do container.yml de propósito: aquele publica no ghcr.io, que serve
# para consumo externo e não exige credencial da AWS. Este aqui é deploy — assume
# role por OIDC (gha-guedder-mcp, em guedder/infra) e mexe no ECS.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC. Sem isto o configure-aws-credentials não assume a role.

env:
  AWS_REGION: us-east-1
  ECR_REPO: guedder/mcp
  CLUSTER: guedder-staging
  SERVICE: mcp-staging
  # Família da task definition, que é quem o Terraform registra. NÃO é o nome do
  # serviço — coincidem hoje, mas o `--task-definition` abaixo depende da família.
  TASK_FAMILY: mcp-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725365475:role/gha-guedder-mcp
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # Tag MUTÁVEL (staging-latest), mesma convenção de guedder-api. O Terraform
      # aponta a task definition para ela e o deploy troca o conteúdo.
      #
      # A tag imutável por sha entra JUNTO, e não no lugar: com só a mutável, um
      # rollback não tem para onde voltar. Foi o que travou a validação da v6.3.0
      # no guedder-api em 13/08 — force-new-deployment reiniciava a mesma imagem
      # e o deploy terminava verde sem código novo.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:staging-latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `--task-definition <familia>` SEM :revisao resolve a última revisão ACTIVE.
      # Sem essa flag o update-service redeploya a revisão em que o serviço já está
      # fixado, e toda revisão registrada pelo Terraform fica órfã (GUE-291) — foi
      # o que deixou o guedder-api-staging cinco horas sem a variável do Cognito.
      # O serviço nasce no Terraform (guedder/infra, root guedder/mcp/staging), e
      # ele só pode ser criado DEPOIS que existir imagem — senão a task reinicia
      # em loop puxando uma tag inexistente. Ou seja: na primeira execução deste
      # workflow o serviço legitimamente ainda não existe.
      #
      # Sem este guarda, esse caso normal deixaria o main vermelho e ensinaria a
      # ignorar CI vermelho, que é pior do que o problema.
      - name: O serviço já existe?
        id: servico
        run: |
          status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query "services[0].status" --output text 2>/dev/null || echo "NONE")
          if [ "$status" = "ACTIVE" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Imagem publicada. Serviço $SERVICE ainda não existe (status=$status) — aplique o root guedder/mcp/staging e rode este workflow de novo."
          fi

      - name: ECS adota a revisão e redeploya
        if: steps.servico.outputs.existe == 'true'
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_FAMILY" \
            --force-new-deployment >/dev/null
          echo "redeploy de staging disparado"

      - name: Esperar estabilizar
        if: steps.servico.outputs.existe == 'true'
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
